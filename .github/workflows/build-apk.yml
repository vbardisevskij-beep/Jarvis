name: Build JARVIS APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download Ukrainian neural voice
        run: |
          mkdir -p app/src/main/assets/voice
          curl -L --fail --retry 3 -o /tmp/voice.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/sherpa-onnx-supertonic-3-tts-int8-2026-05-11.tar.bz2
          tar -xjf /tmp/voice.tar.bz2 -C app/src/main/assets/voice --strip-components=1
          rm -f /tmp/voice.tar.bz2
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-4.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
